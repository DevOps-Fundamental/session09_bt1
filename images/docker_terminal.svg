<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="100%" height="100%">
  <defs>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="950" height="720" rx="14" fill="#0f172a"/>

  <g filter="url(#winShadow)">
    <rect x="25" y="25" width="900" height="670" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <rect x="25" y="25" width="900" height="38" rx="10" fill="url(#termHeader)"/>
    
    <circle cx="48" cy="44" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="68" cy="44" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="88" cy="44" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <text x="475" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">devops@ubuntu-vps: ~ • Docker Engine &amp; Hello-World Execution</text>

    <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11">
      <!-- Step 1: group add -->
      <text x="45" y="85" fill="#58a6ff" font-weight="600">devops@ubuntu-vps:~$</text>
      <text x="210" y="85" fill="#f0f6fc">sudo usermod -aG docker $USER &amp;&amp; newgrp docker</text>

      <!-- Step 2: docker version -->
      <text x="45" y="112" fill="#58a6ff" font-weight="600">devops@ubuntu-vps:~$</text>
      <text x="210" y="112" fill="#f0f6fc">docker version</text>
      <text x="45" y="130" fill="#79c0ff">Client: Docker Engine - Community</text>
      <text x="65" y="146" fill="#cbd5e1">Version:           26.0.0</text>
      <text x="65" y="162" fill="#cbd5e1">API version:       1.45</text>
      <text x="65" y="178" fill="#cbd5e1">OS/Arch:           linux/amd64</text>
      <text x="45" y="196" fill="#79c0ff">Server: Docker Engine - Community</text>
      <text x="65" y="212" fill="#cbd5e1">Engine Version:    26.0.0</text>
      <text x="65" y="228" fill="#cbd5e1">API version:       1.45 (minimum version 1.24)</text>

      <!-- Step 3: docker info -->
      <text x="45" y="258" fill="#58a6ff" font-weight="600">devops@ubuntu-vps:~$</text>
      <text x="210" y="258" fill="#f0f6fc">docker info | grep -E 'Containers|Images|Server Version|Storage Driver'</text>
      <text x="45" y="276" fill="#cbd5e1"> Containers: 1 (Running: 0, Paused: 0, Stopped: 1)</text>
      <text x="45" y="292" fill="#cbd5e1"> Images: 1</text>
      <text x="45" y="308" fill="#cbd5e1"> Server Version: 26.0.0</text>
      <text x="45" y="324" fill="#cbd5e1"> Storage Driver: overlay2</text>

      <!-- Step 4: docker run hello-world -->
      <text x="45" y="354" fill="#58a6ff" font-weight="600">devops@ubuntu-vps:~$</text>
      <text x="210" y="354" fill="#f0f6fc">docker run hello-world</text>
      <text x="45" y="374" fill="#8b949e">Unable to find image 'hello-world:latest' locally</text>
      <text x="45" y="390" fill="#8b949e">latest: Pulling from library/hello-world</text>
      <text x="45" y="406" fill="#8b949e">c1ec31eb5944: Pull complete</text>
      <text x="45" y="422" fill="#8b949e">Digest: sha256:d2cc9a161d63e5dc23512b4a76e253b7a711775e453771909795e1e19488a0a9</text>
      <text x="45" y="438" fill="#3fb950">Status: Downloaded newer image for hello-world:latest</text>

      <!-- Hello-World Output Banner -->
      <text x="45" y="470" fill="#3fb950" font-weight="700" font-size="13">Hello from Docker!</text>
      <text x="45" y="490" fill="#f0f6fc">This message shows that your installation appears to be working correctly.</text>

      <text x="45" y="520" fill="#8b949e">To generate this message, Docker took the following steps:</text>
      <text x="65" y="538" fill="#cbd5e1">1. The Docker client contacted the Docker daemon.</text>
      <text x="65" y="556" fill="#cbd5e1">2. The Docker daemon pulled the "hello-world" image from the Docker Hub.</text>
      <text x="65" y="574" fill="#cbd5e1">3. The Docker daemon created a new container from that image.</text>
      <text x="65" y="592" fill="#cbd5e1">4. The Docker daemon streamed that output to the Docker client.</text>

      <!-- Success conclusion -->
      <text x="45" y="630" fill="#58a6ff" font-weight="600">devops@ubuntu-vps:~$</text>
      <text x="210" y="630" fill="#f0f6fc">echo "Docker Engine verified successfully without sudo prefix."</text>
      <text x="45" y="650" fill="#3fb950">Docker Engine verified successfully without sudo prefix.</text>
    </g>
  </g>
</svg>
