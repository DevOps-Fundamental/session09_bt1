<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="580" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC DOCKER ENGINE VÀ QUY TRÌNH CHẠY CONTAINER HELLO-WORLD</text>
  <text x="475" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Docker Client • Docker Daemon (dockerd) • Unix Socket • Container Runtime</text>

  <!-- Left: Docker Client -->
  <g transform="translate(40, 105)">
    <rect width="250" height="340" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="42" rx="12" fill="url(#cliGrad)"/>
    <text x="125" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DOCKER CLIENT (CLI)</text>

    <g transform="translate(15, 55)">
      <rect width="220" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Người dùng Non-Root</text>
      <text x="110" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Group: docker</text>
      <text x="110" y="58" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Không cần dùng lệnh sudo</text>
    </g>

    <g transform="translate(15, 145)">
      <rect width="220" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Lệnh thực thi</text>
      <text x="110" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">docker version</text>
      <text x="110" y="60" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">docker info</text>
      <text x="110" y="78" font-family="monospace" font-size="10.5" fill="#a7f3d0" text-anchor="middle">docker run hello-world</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="220" height="65" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Giao tiếp Socket</text>
      <text x="110" y="44" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">/var/run/docker.sock</text>
    </g>
  </g>

  <!-- Middle: Docker Host / Daemon -->
  <g transform="translate(320, 105)">
    <rect width="310" height="340" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="310" height="42" rx="12" fill="url(#hostGrad)"/>
    <text x="155" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DOCKER HOST (DAEMON)</text>

    <g transform="translate(15, 52)">
      <rect width="280" height="70" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="140" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">Docker Daemon (dockerd)</text>
      <text x="140" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">systemd: docker.service</text>
      <text x="140" y="58" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Quản lý Images và Containers</text>
    </g>

    <g transform="translate(15, 132)">
      <rect width="280" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="140" y="22" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Kho ảnh cục bộ (Images)</text>
      <text x="140" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">hello-world:latest</text>
      <text x="140" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Kích thước: ~13.3 KB</text>
      <text x="140" y="74" font-family="sans-serif" font-size="9.5" fill="#34d399" text-anchor="middle">Tự động tải về nếu chưa có</text>
    </g>

    <g transform="translate(15, 227)">
      <rect width="280" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="140" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">Container Runtime</text>
      <text x="140" y="42" font-family="monospace" font-size="10.5" fill="#ecfdf5" text-anchor="middle">containerd / runc</text>
      <text x="140" y="60" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Khởi tạo môi trường cô lập</text>
      <text x="140" y="76" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">In thông điệp và kết thúc an toàn</text>
    </g>
  </g>

  <!-- Right: Docker Registry -->
  <g transform="translate(660, 105)">
    <rect width="250" height="340" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="42" rx="12" fill="url(#hubGrad)"/>
    <text x="125" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DOCKER REGISTRY</text>

    <g transform="translate(15, 55)">
      <rect width="220" height="85" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">Docker Hub</text>
      <text x="110" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">hub.docker.com</text>
      <text x="110" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Kho lưu trữ ảnh chính thức</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="220" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Quy trình Pull</text>
      <text x="110" y="42" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">1. Kiểm tra cache máy chủ</text>
      <text x="110" y="58" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">2. Không thấy -> Gửi request</text>
      <text x="110" y="74" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">3. Tải các layers về máy</text>
    </g>

    <g transform="translate(15, 265)">
      <rect width="220" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Trạng thái xác thực</text>
      <text x="110" y="40" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Công khai (Public Image)</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 290 270 L 320 270" stroke="#0ea5e9" stroke-width="2.5" fill="none"/>
  <path d="M 630 270 L 660 270" stroke="#8b5cf6" stroke-width="2.5" fill="none"/>

  <!-- Footer Banner -->
  <rect x="40" y="470" width="870" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="495" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">NGUYÊN LÝ HOẠT ĐỘNG CỦA DOCKER HELLO-WORLD:</text>
  <text x="60" y="517" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Docker CLI liên lạc với Docker Daemon qua Unix Domain Socket /var/run/docker.sock.</text>
  <text x="60" y="537" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Thêm người dùng vào nhóm docker cho phép thực thi toàn quyền mà không cần gõ tiền tố sudo mỗi lần chạy lệnh.</text>
</svg>
